<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Agent</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .app {
      max-width: 800px;
      margin: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #334155;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      color: #94a3b8;
      margin-bottom: 0;
    }

    #messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .user {
      background: #1e293b;
    }

    .agent {
      background: #172554;
    }

    .input-area {
      padding: 15px;
      border-top: 1px solid #334155;
      display: flex;
      gap: 10px;
      position: sticky;
      bottom: 0;
      background: #0f172a;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 55px;
      max-height: 150px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #1e293b;
      color: white;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #3b82f6;
    }

    button {
      width: 90px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .typing {
      opacity: 0.7;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>🤖 My AI Agent</h1>
    <p>مساعدك الشخصي للمشاريع والمهام</p>
  </header>

  <main id="messages">

    <div class="message agent">
      مرحباً! أنا وكيلك الذكي.
      اكتب لي المهمة التي تريد تنفيذها.
    </div>

  </main>

  <div class="input-area">

    <textarea
      id="input"
      placeholder="اكتب المهمة هنا..."
      autocomplete="off"
    ></textarea>

    <button id="sendButton" onclick="sendMessage()">
      إرسال
    </button>

  </div>

</div>

<script>

async function sendMessage() {

  const input = document.getElementById("input");
  const messages = document.getElementById("messages");
  const button = document.getElementById("sendButton");

  const text = input.value.trim();

  if (!text) return;

  // عرض رسالة المستخدم
  messages.innerHTML += `
    <div class="message user">
      ${escapeHtml(text)}
    </div>
  `;

  // تنظيف مربع الكتابة
  input.value = "";

  // تعطيل الزر أثناء المعالجة
  button.disabled = true;

  // رسالة الانتظار
  const loading = document.createElement("div");

  loading.className = "message agent typing";
  loading.id = "loading";
  loading.textContent = "جاري التفكير...";

  messages.appendChild(loading);

  scrollToBottom();

  try {

    const response = await fetch("/api/chat", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text
      })

    });

    const data = await response.json();

    const loadingMessage =
      document.getElementById("loading");

    if (!response.ok) {

      loadingMessage.textContent =
        data.error || "حدث خطأ أثناء الاتصال بالوكيل.";

    } else {

      loadingMessage.classList.remove("typing");

      loadingMessage.textContent =
        data.reply || "لم أحصل على إجابة من الوكيل.";

    }

  } catch (error) {

    const loadingMessage =
      document.getElementById("loading");

    loadingMessage.textContent =
      "تعذر الاتصال بالوكيل. تأكد من أن Backend يعمل بشكل صحيح.";

    console.error(error);

  } finally {

    button.disabled = false;

    scrollToBottom();

    input.focus();
  }
}


// السماح بالإرسال بواسطة Ctrl + Enter
document.getElementById("input").addEventListener(
  "keydown",
  function(event) {

    if (event.ctrlKey && event.key === "Enter") {
      sendMessage();
    }

  }
);


// حماية النص من HTML
function escapeHtml(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


// النزول إلى آخر رسالة
function scrollToBottom() {

  const messages =
    document.getElementById("messages");

  messages.scrollTop =
    messages.scrollHeight;
}

</script>

</body>
</html>
